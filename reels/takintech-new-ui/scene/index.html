<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>TakinTech Reel</title>
<style>
  @font-face { font-family: Vaz; src: url(../assets/fonts/Vazirmatn-Regular.ttf); font-weight: 400; }
  @font-face { font-family: Vaz; src: url(../assets/fonts/Vazirmatn-Medium.ttf); font-weight: 500; }
  @font-face { font-family: Vaz; src: url(../assets/fonts/Vazirmatn-Bold.ttf); font-weight: 700; }
  @font-face { font-family: Vaz; src: url(../assets/fonts/Vazirmatn-ExtraBold.ttf); font-weight: 800; }
  @font-face { font-family: Vaz; src: url(../assets/fonts/Vazirmatn-Black.ttf); font-weight: 900; }

  :root {
    --bg: #05070d; --bg2: #0b1224; --primary: #3d7bff; --accent: #2ee6d6;
    --violet: #8b5cf6; --text: #f4f7ff; --muted: #8a97b8;
  }
  html, body { margin: 0; padding: 0; background: #000; }
  * { box-sizing: border-box; }

  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--bg); color: var(--text); font-family: Vaz, sans-serif;
    direction: rtl;
  }
  #bg, #fx, #grain { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #grain { mix-blend-mode: overlay; opacity: .07; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .scene { position: absolute; inset: 0; display: none; }
  .ltr { direction: ltr; }

  .line { text-align: center; line-height: 1.25; white-space: nowrap; }
  .word { display: inline-block; will-change: transform, opacity, filter; }
  .grad {
    background: linear-gradient(100deg, var(--accent), var(--primary) 55%, var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* captions */
  .cap { position: absolute; top: 250px; left: 0; right: 0; text-align: center; }
  .cap .line { font-weight: 900; font-size: 86px; letter-spacing: -.5px;
    filter: drop-shadow(0 8px 30px rgba(0,0,0,.55)); }
  .cap .bar { height: 10px; width: 260px; margin: 18px auto 0; border-radius: 5px;
    background: linear-gradient(90deg, var(--violet), var(--primary), var(--accent));
    transform-origin: 50% 50%; box-shadow: 0 0 24px rgba(46,230,214,.45); }

  /* browser mockup */
  .persp { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 40%; }
  .browser { position: absolute; border-radius: 28px; overflow: hidden; background: #0d1322;
    box-shadow: 0 60px 120px rgba(0,0,0,.65), 0 0 0 1.5px rgba(255,255,255,.10),
                0 0 90px rgba(61,123,255,.28);
    direction: ltr; transform-style: preserve-3d; }
  .browser .bar { position: absolute; top: 0; left: 0; right: 0; height: 56px;
    background: linear-gradient(#1b2337, #141b2c); display: flex; align-items: center;
    padding: 0 22px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .browser.sm .bar { height: 44px; padding: 0 16px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 9px; }
  .browser.sm .dots i { width: 11px; height: 11px; margin-right: 7px; }
  .dots i:nth-child(1) { background: #ff5f57; } .dots i:nth-child(2) { background: #febc2e; }
  .dots i:nth-child(3) { background: #28c840; }
  .url { flex: 1; height: 34px; margin: 0 70px 0 30px; border-radius: 17px;
    background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center;
    gap: 8px; font: 500 20px Vaz; color: #c9d3ee; letter-spacing: .4px; }
  .browser.sm .url { height: 26px; font-size: 15px; margin: 0 50px 0 20px; }
  .url svg { width: 16px; height: 16px; }
  .viewport { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; overflow: hidden; background: #fff; }
  .browser.sm .viewport { top: 44px; }
  .viewport .layer { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .viewport img { display: block; width: 100%; }
  .scrollbar { position: absolute; right: 6px; width: 8px; border-radius: 4px;
    background: rgba(20,30,50,.45); }

  .floor-glow { position: absolute; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(61,123,255,.55), rgba(139,92,246,.18) 60%, transparent);
    filter: blur(30px); }

  /* phone */
  .phone { position: absolute; border-radius: 74px; background: #0a0d14;
    box-shadow: inset 0 0 0 2px #2b3348, 0 0 0 3px #10141e, 0 70px 140px rgba(0,0,0,.75),
                0 0 100px rgba(46,230,214,.22); }
  .phone .screen { position: absolute; inset: 16px; border-radius: 58px; overflow: hidden; background: #fff; }
  .phone .screen .layer { position: absolute; top: 0; left: 0; width: 100%; }
  .phone .screen img { display: block; width: 100%; }
  .phone .island { position: absolute; top: 34px; left: 50%; width: 140px; height: 40px;
    margin-left: -70px; border-radius: 20px; background: #000; }

  /* highlight box (detail scene) */
  .hl { position: absolute; border-radius: 18px; border: 4px solid var(--accent);
    box-shadow: 0 0 0 4000px rgba(4,8,18,.0), 0 0 40px rgba(46,230,214,.7); }

  /* pill */
  .pill { display: inline-flex; align-items: center; gap: 16px; padding: 14px 34px;
    border-radius: 999px; background: rgba(255,255,255,.07);
    border: 2px solid rgba(255,255,255,.14); font-weight: 700; font-size: 50px;
    direction: ltr; box-shadow: 0 0 40px rgba(61,123,255,.25); }
  .pill .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 18px var(--accent); }

  /* CTA */
  .addr { position: absolute; left: 100px; width: 880px; height: 150px; border-radius: 75px;
    background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.16);
    display: flex; align-items: center; padding: 0 50px; gap: 26px; direction: ltr;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 60px rgba(61,123,255,.25); }
  .addr svg { width: 52px; height: 52px; flex: none; }
  .addr .typed { font-weight: 700; font-size: 66px; letter-spacing: .5px; white-space: pre; }
  .addr .caret { width: 5px; height: 72px; background: var(--accent); border-radius: 3px; }
  .btn { position: absolute; left: 220px; width: 640px; height: 132px; border-radius: 66px;
    background: linear-gradient(100deg, var(--violet), var(--primary) 60%, #2aa6ff);
    display: flex; align-items: center; justify-content: center; gap: 22px;
    font-weight: 800; font-size: 52px; color: #fff;
    box-shadow: 0 24px 70px rgba(61,123,255,.55), inset 0 2px 0 rgba(255,255,255,.25); }
  .ripple { position: absolute; border-radius: 50%; border: 6px solid rgba(255,255,255,.9); }
  .cursor { position: absolute; width: 64px; height: 64px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.6)); }

  /* outro */
  .logo-box { position: absolute; left: 540px; top: 900px; width: 0; height: 0; }
  .logo-inner { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: flex;
    align-items: center; justify-content: center; }
  .logo-inner svg, .logo-inner img { display: block; width: 100%; height: 100%; }
  .sweep { position: absolute; inset: 0; pointer-events: none;
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center; mix-blend-mode: screen; }
  .tagline { position: absolute; left: 0; right: 0; text-align: center; font-weight: 500;
    font-size: 44px; color: var(--muted); letter-spacing: 1px; }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 60% at 50% 48%, transparent 58%, rgba(0,0,0,.45) 100%); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="mblur" x="-20%" y="-5%" width="140%" height="110%">
    <feGaussianBlur id="mblurStd" stdDeviation="0 0"/>
  </filter>
</svg>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="cam"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="flash"></div>
  <div id="fade"></div>
</div>
<script src="reel.js"></script>
</body>
</html>
